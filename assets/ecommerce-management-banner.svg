<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 1.5px;
      fill: #60a5fa;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .card-val {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 17px;
      fill: #38bdf8;
    }

    /* Dynamic subtle floating animations */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(1deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(12px) rotate(-1deg); }
    }
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.15); opacity: 0.45; }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }

    .float-card-1 {
      animation: floatSlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .float-card-2 {
      animation: floatReverse 7s ease-in-out infinite;
      transform-origin: center;
    }
    .float-card-3 {
      animation: floatSlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .orb-glow {
      animation: pulseOrb 8s ease-in-out infinite;
      transform-origin: 950px 180px;
    }
    .moving-circuit {
      stroke-dasharray: 8 12;
      animation: dashMove 12s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#grid)" />

  <!-- Dynamic Glowing Background Orbs -->
  <circle class="orb-glow" cx="960" cy="180" r="160" fill="#6366f1" filter="url(#glow)" />
  <circle class="orb-glow" cx="1060" cy="240" r="100" fill="#ec4899" filter="url(#glow)" />
  <circle class="orb-glow" cx="300" cy="50" r="120" fill="#3b82f6" filter="url(#glow)" />

  <!-- Animated Background Network / Flow lines -->
  <g class="moving-circuit" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.35" fill="none">
    <path d="M 720 180 C 820 120, 880 220, 970 170 C 1030 140, 1080 180, 1150 160" />
    <path d="M 750 260 C 840 290, 920 220, 1020 250 C 1090 270, 1130 230, 1180 240" />
    <path d="M 800 90 C 880 70, 940 140, 1040 100 C 1100 80, 1140 110, 1180 90" />
  </g>

  <!-- Floating Dynamic Cards (Right Side Visuals) -->
  <!-- Card 1: Orders & Catalog -->
  <g class="float-card-1" transform="translate(820, 45)">
    <rect width="210" height="74" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="28" cy="37" r="14" fill="#0284c7" fill-opacity="0.25" />
    <text x="28" y="42" font-size="14" text-anchor="middle" fill="#38bdf8">📦</text>
    <text x="54" y="32" class="card-title">Catalog &amp; Inventory</text>
    <text x="54" y="54" class="card-val">Real-Time Sync</text>
  </g>

  <!-- Card 2: Headless & SaaS -->
  <g class="float-card-2" transform="translate(930, 142)">
    <rect width="220" height="74" rx="14" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="28" cy="37" r="14" fill="#9333ea" fill-opacity="0.25" />
    <text x="28" y="42" font-size="14" text-anchor="middle" fill="#c084fc">⚡</text>
    <text x="54" y="32" class="card-title">Ecosystem Architecture</text>
    <text x="54" y="54" class="card-val">Headless &amp; SaaS</text>
  </g>

  <!-- Card 3: Global GMV & Growth -->
  <g class="float-card-3" transform="translate(800, 238)">
    <rect width="230" height="74" rx="14" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.2" filter="url(#shadow)" />
    <circle cx="28" cy="37" r="14" fill="#db2777" fill-opacity="0.25" />
    <text x="28" y="42" font-size="14" text-anchor="middle" fill="#f472b6">📈</text>
    <text x="54" y="32" class="card-title">Global Commerce</text>
    <text x="54" y="54" class="card-val">$8.1T+ Sector Scale</text>
  </g>

  <!-- Foreground Content (Left Side, Crystal Clear Readability) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 60)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="16" cy="15" r="5" fill="#38bdf8" />
      <text x="28" y="20" class="badge-text">⚡ CURATED PLATFORMS 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">
      Awesome E-Commerce
    </text>
    <text x="0" y="195" class="title-text" fill="url(#primaryGrad)">
      Management Platforms 🛒
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle-text">
      Store Administration • Catalog Systems • Self-Hosted Backends • Enterprise SaaS
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="21" class="tag-text">🏪 Store Admin</text>

      <!-- Tag 2 -->
      <rect x="142" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="156" y="21" class="tag-text">🚀 Headless APIs</text>

      <!-- Tag 3 -->
      <rect x="304" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="318" y="21" class="tag-text">💻 100% Open Source</text>

      <!-- Tag 4 -->
      <rect x="476" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="490" y="21" class="tag-text">☁️ Cloud Solutions</text>
    </g>
  </g>
</svg>
